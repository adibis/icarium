baseURL: https://adibis.github.io/icarium/
locale: en-us
title: icarium
theme: hextra

enableRobotsTXT: true
enableGitInfo: true

params:
  description: "Open-source structural CDC/RDC checker in Zig: full-chip SystemVerilog, JSON-native formats, benchmarked against OpenTitan's own waivers."

  navbar:
    displayTitle: true
    displayLogo: true
    width: wide
    logo:
      path: images/logo.svg
      width: "22"
      height: "22"

  page:
    width: wide

  theme:
    default: light
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: false

  imageZoom:
    enable: true

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

menu:
  main:
    - name: Docs
      pageRef: /docs
      weight: 1
    - name: Rules
      pageRef: /docs/rules
      weight: 2
    - name: Benchmarks
      pageRef: /docs/benchmarks
      weight: 3
    - name: About
      pageRef: /about
      weight: 5
    - name: search
      weight: 5
      params:
        type: search
    - name: theme-toggle
      weight: 6
      params:
        type: theme-toggle
    - name: GitHub
      url: https://github.com/adibis/icarium
      weight: 7
      params:
        icon: github

markup:
  highlight:
    noClasses: false
    style: monokai
    lineNos: false
  goldmark:
    renderer:
      unsafe: true
