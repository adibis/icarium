name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Zig version
        id: pins
        run: echo "zig=$(sed -n 's/^  "zig_version": "\(.*\)",$/\1/p' pins.json)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.pins.outputs.zig }}
      - run: sh scripts/check-pins.sh
      - run: zig build test --summary all
      - run: zig build
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned Zig version
        id: pins
        run: echo "zig=$(sed -n 's/^  "zig_version": "\(.*\)",$/\1/p' pins.json)" >> "$GITHUB_OUTPUT"
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.pins.outputs.zig }}
      - name: Install Yosys if packaged
        run: sudo apt-get update -qq && sudo apt-get install -y -qq yosys || echo "yosys unavailable, e2e will skip"
      - name: Install jsonschema for schema-gated suites
        run: pip install jsonschema || echo "jsonschema unavailable, schema-gated suites will skip"
      - name: Install toon-format for TOON round-trip proof
        run: pip install toon-format || echo "toon-format unavailable, round-trip will skip"
      - name: TOON size proof (skips without yosys)
        run: sh bench/toon-tokens.sh; code=$?; if [ $code -eq 3 ]; then echo "toon proof skipped: yosys not installed"; else exit $code; fi
      - run: zig build
      - name: End-to-end suite (skips without yosys)
        run: sh tests/e2e/run.sh; code=$?; if [ $code -eq 3 ]; then echo "e2e skipped: yosys not installed"; else exit $code; fi
      - name: Rule fixtures (skips without yosys)
        run: sh fixtures/run.sh; code=$?; if [ $code -eq 3 ]; then echo "fixtures skipped: yosys not installed"; else exit $code; fi
      - name: Schema validation (skips without yosys/jsonschema)
        run: sh scripts/validate-schemas.sh; code=$?; if [ $code -eq 3 ]; then echo "schemas skipped"; else exit $code; fi
      - name: Suppression suite (skips without yosys/jsonschema)
        run: sh tests/suppress/run.sh; code=$?; if [ $code -eq 3 ]; then echo "suppress skipped"; else exit $code; fi
